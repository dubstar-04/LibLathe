name: Build and upload to PyPI

on:
  push:
    tags:
    - 'v*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          # macos-latest is Apple Silicon; x86_64 is cross-compiled for Intel Macs
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          # Keep the published CPython range aligned with the tested range.
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-* pp*
          CIBW_ENABLE: pypy
          # PyPy's macOS sysconfig passes GNU-only linker flags (-Bsymbolic-functions)
          CIBW_SKIP: pp*-macosx_*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_to_pypi:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/p/liblathe
    permissions:
      id-token: write
    steps:
      - name: Download wheel distributions
        uses: actions/download-artifact@v4
        with:
            pattern: wheels*
            path: dist
            merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@v4
        with:
          pattern: sdist*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
